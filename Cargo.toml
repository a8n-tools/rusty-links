[package]
name = "rusty-links"
version = "0.1.0"
edition = "2021"
default-run = "rusty-links"

[dependencies]
# Web framework
dioxus = { version = "=0.8.0-alpha.3", features = ["fullstack", "router"] }
dioxus-web = { version = "=0.8.0-alpha.3", optional = true }
axum = { version = "0.8.9", features = ["tokio"], optional = true }
axum-extra = { version = "0.12.6", features = ["cookie"], optional = true }
tower = { version = "0.5.3", features = ["util"], optional = true }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"], optional = true }
http = { version = "1.5.0", optional = true }

# Database
sqlx = { version = "0.9.1", features = ["postgres", "runtime-tokio-native-tls", "migrate", "uuid", "chrono"], optional = true }

# Async runtime
tokio = { version = "1.48.0", features = ["full"], optional = true }
futures = "0.3.34"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# HTTP client (for scraping - server only uses native TLS)
# For WASM, we use target-specific dependency below

# HTML parsing (using git until next release with selectors 0.33 / rustc-hash)
scraper = { git = "https://github.com/rust-scraper/scraper" }

# Configuration
dotenvy = "0.15.7"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

# Utilities
uuid = { version = "1.29.3", features = ["serde", "v4", "js"] }
url = "2.5.9"
urlencoding = "2.1.3"
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.2"
native-tls = { version = "0.2.18", optional = true }

# Password hashing (standalone + server only)
argon2 = { version = "0.6.0", optional = true }
bcrypt = { version = "0.19.3", optional = true }

# JWT authentication
jsonwebtoken = { version = "9.2", optional = true }

# Webhook signature verification (server only)
hmac = { version = "0.13.0", optional = true }
sha2 = { version = "0.11.1", optional = true }
hex = { version = "0.4.3", optional = true }

# Base64 (for saas JWT payload decoding)
base64 = "0.23.1"

# Session management
rand = "0.9.2"

# JTI idempotency + JWKS cache (saas mode)
moka = { version = "0.12.16", features = ["future"], optional = true }

# Outbound email (new sign-in location alerts, server only)
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls"], optional = true }

# Cookie max-age handling (saas mode — cookie crate re-exports this)
time = { version = "0.3.55", optional = true }

# Trusted-proxy CIDR matching for the forwarded-header gate (server only)
ipnetwork = { version = "0.21.1", optional = true }

# WASM compatibility - must be in main dependencies to propagate to all transitive deps
getrandom = "0.4.3"

# Server-side reqwest (native TLS for scraping)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13.5", features = ["json", "cookies"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# gloo-net for browser HTTP requests (uses browser's native fetch API)
gloo-net = { version = "0.8.0", features = ["json"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
gloo-timers = { version = "0.4.1", features = ["futures"] }
web-sys = { version = "0.3.107", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlAnchorElement",
    "Navigator",
    "Clipboard",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "UrlSearchParams",
    "Location",
    "FileList",
    "File",
    "Storage",
] }

# Deployment mode (hosted vs standalone) is resolved at runtime from the
# `OIDC_ISSUER` env var, not at compile time. A single binary serves both.
[features]
default = []
server = [
    "dioxus/server",
    "dep:axum",
    "dep:axum-extra",
    "dep:tower",
    "dep:tower-http",
    "dep:tokio",
    "dep:sqlx",
    "dep:http",
    "dep:jsonwebtoken",
    "dep:native-tls",
    "dep:argon2",
    "dep:bcrypt",
    "dep:hmac",
    "dep:sha2",
    "dep:hex",
    "dep:moka",
    "dep:time",
    "dep:lettre",
    "dep:ipnetwork",
]
web = [
    "dioxus/web",
]

[dev-dependencies]

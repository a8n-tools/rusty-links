---

# Create a Forgejo release when a release/* branch is merged to main, by
# calling the reusable workflow in psa-systems/common.
name: Create release

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

jobs:
  create-release:
    if: >-
      github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
    uses: https://dev.a8n.run/psa-systems/common/.forgejo/workflows/create-release.yml@main
    # The caller must set `runs-on` itself: this Forgejo instance does not
    # expand a cross-repo reusable `uses:` otherwise (see check.yml).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_BASE_MEDIUM }}
    secrets: inherit

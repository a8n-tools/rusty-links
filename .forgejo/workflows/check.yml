---

# Validate code on every push and pull request: clippy, fmt, build, tests.
name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: clippy + fmt + tests
    # Dev label: this job compiles and links Rust on the runner (build scripts and
    # the host-target build/test need cc/ld plus glibc and OpenSSL headers, which
    # only the dev image carries).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_DEV_LATEST }}

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          # Full history so the merge-base with origin/main is available to the
          # migration-immutability guard below.
          fetch-depth: 0

      - name: Guard migration immutability
        # Reject any PR/push that edits, renames, or deletes a migration already
        # committed on main (sqlx checksum drift breaks every applied DB). See
        # scripts/check-migration-immutability.nu and LINKS-26 / DEV-395.
        run: nu scripts/check-migration-immutability.nu

      - name: Cache Rust build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cap build parallelism
        # nproc/2 cap: never claim more than half the host (see CI.md "Concurrency cap").
        run: echo "CARGO_BUILD_JOBS=$(($(nproc) / 2))" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check web/WASM
        run: cargo check --features web --target wasm32-unknown-unknown

      - name: Build
        run: cargo build --all-targets

      - name: Unit tests
        run: cargo test --lib

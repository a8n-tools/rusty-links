---

# Validate code on every push and pull request: clippy, fmt, build, tests.
name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: clippy + fmt + tests
    # Dev label: this job compiles and links Rust on the runner (build scripts and
    # the host-target build/test need cc/ld plus glibc and OpenSSL headers, which
    # only the dev image carries).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_HEAVY }}

    # Postgres for the tests/ targets (LINKS-44). Without it the only test legs
    # were `cargo test --lib`, so every query in src/models/ and src/auth/ was
    # compile-checked and never executed. 17-alpine matches compose.dev.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rustylinks
          POSTGRES_PASSWORD: rustylinks
          POSTGRES_DB: rustylinks
        # No published port: the runner puts the job container and this service
        # on one network, so the service alias is the address. A published port
        # lands in the docker daemon's namespace, which the job cannot reach.
        options: >-
          --health-cmd="pg_isready --username=rustylinks --dbname=rustylinks"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      # tests/common/mod.rs derives a sibling `rustylinks_test` database from
      # this and migrates that, so the suites never share a database with
      # anything else pointed at the same server.
      DATABASE_URL: postgres://rustylinks:rustylinks@postgres:5432/rustylinks

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          # Full history so the merge-base with origin/main is available to the
          # migration-immutability guard below.
          fetch-depth: 0

      - name: Guard migration immutability
        # Reject any PR/push that edits, renames, or deletes a migration already
        # committed on main (sqlx checksum drift breaks every applied DB). See
        # scripts/check-migration-immutability.nu and LINKS-26 / DEV-395.
        run: nu scripts/check-migration-immutability.nu

      - name: Guard the migration history doc
        # Reject a migration with no row in the docs/DATABASE.md Migration
        # History table, or a row naming no migration. See
        # scripts/check-migration-docs.nu and LINKS-46. --self-test first, so a
        # guard that stopped parsing fails the job rather than passing vacuously.
        run: |
          nu scripts/check-migration-docs.nu --self-test
          nu scripts/check-migration-docs.nu

      - name: Guard justfile build flags
        # Reject a justfile `--features` name Cargo.toml does not define or a
        # `--build-arg` no Dockerfile declares. See scripts/check-build-flags.nu
        # and LINKS-25.
        run: nu scripts/check-build-flags.nu

      - name: Guard the dev-clean volume list
        shell: nu {0}
        # Reject a volume `just dev-clean` removes that no compose file declares,
        # or a declared volume it never removes. See
        # scripts/check-dev-clean-volumes.nu and LINKS-63. --self-test first, so a
        # guard that stopped parsing fails the job rather than passing vacuously.
        run: |
          nu scripts/check-dev-clean-volumes.nu --self-test
          nu scripts/check-dev-clean-volumes.nu

      - name: Guard check-suite parity
        shell: nu {0}
        # Reject drift between the `pre-commit` recipe in justfile and the steps
        # below: they are two hand-maintained copies of one suite, so a leg
        # dropped or weakened in either is caught here. See
        # scripts/check-suite-parity.nu and LINKS-49. --self-test first, so a
        # guard that stopped parsing fails the job rather than passing vacuously.
        run: |
          nu scripts/check-suite-parity.nu --self-test
          nu scripts/check-suite-parity.nu

      - name: Cache Rust build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cap build parallelism
        # nproc/2 cap: never claim more than half the host (see CI.md "Concurrency cap").
        run: echo "CARGO_BUILD_JOBS=$(($(nproc) / 2))" >> "$GITHUB_ENV"

      - name: Dependency audit
        shell: nu {0}
        # Fail on a RUSTSEC vulnerability against Cargo.lock that no dated exception
        # covers. Reads the lockfile, not the build, so it runs before the compile legs
        # and fails in seconds. See scripts/check-dependency-audit.nu and LINKS-52;
        # .forgejo/workflows/audit.yml runs the same guard weekly, which is the only way
        # an advisory published against an unchanged Cargo.lock is ever seen.
        run: |
          nu scripts/check-dependency-audit.nu --self-test
          nu scripts/check-dependency-audit.nu

      - name: Ensure the generated stylesheet exists
        shell: nu {0}
        # assets/tailwind.css is gitignored and generated by `dx build`, but src/main.rs
        # include_str!s it, so the --features server legs need the file to exist.
        run: if not ("assets/tailwind.css" | path exists) { "" | save assets/tailwind.css }

      # Clippy runs three times, build and test twice, so all three compilation
      # configurations are covered. `default = []` gates every server module
      # behind `#[cfg(feature = "server")]`, so the default-feature legs on their own
      # compile almost none of the crate (LINKS-36).
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (server)
        run: cargo clippy --all-targets --features server -- -D warnings

      - name: Clippy (web/wasm)
        # This leg was a bare `cargo check`: no clippy lint reached the browser build
        # and no --deny warnings, so five warnings in `#[cfg(target_arch = "wasm32")]`
        # code stayed green, which no other leg compiles at all (LINKS-39).
        run: cargo clippy --all-targets --features web --target wasm32-unknown-unknown -- -D warnings

      - name: Build (default features)
        run: cargo build --all-targets

      - name: Build (server)
        run: cargo build --all-targets --features server

      - name: Unit tests (default features)
        run: cargo test --lib

      - name: Unit tests (server)
        run: cargo test --features server --lib

      - name: Doc tests (server)
        shell: nu {0}
        # The doc examples are the one test target no `--lib` or `--all-targets`
        # run compiles, so all ten had rotted into compile errors on missing
        # `use` lines while every check stayed green (LINKS-48). The guard fails
        # on an empty, ignored or filtered collection, because `cargo test --doc`
        # exits 0 when it collects nothing, which is what the default-feature leg
        # would do: `default = []` cfgs out every documented module.
        run: |
          nu scripts/check-doc-tests-ran.nu --self-test
          nu scripts/check-doc-tests-ran.nu

      - name: Apply migrations to the test database
        # Creates the sibling `rustylinks_test` database and applies every
        # migration through sqlx::migrate!, so a migration that does not apply
        # to an empty database fails here by name rather than inside an
        # unrelated test. No sqlx-cli install needed.
        run: cargo test --features server --test db_schema

      - name: Integration tests (Postgres-backed)
        shell: nu {0}
        # Runs every tests/*.rs target and fails when a database-backed one is
        # skipped, ignored, filtered out or absent: `cargo test` exits 0 on an
        # empty run, which is how LINKS-33 and LINKS-35 both shipped with no
        # executed SQL. --self-test first, so a guard that stopped detecting
        # fails the job rather than passing vacuously.
        run: |
          nu scripts/check-db-tests-ran.nu --self-test
          nu scripts/check-db-tests-ran.nu

  secrets:
    # Secrets scan (kingfisher, trufflehog, noseyparker), one required check each
    # under `Check / `. The caller must set `runs-on`: this Forgejo instance does
    # not expand a cross-repo reusable `uses:` otherwise.
    uses: https://dev.a8n.run/psa-systems/common/.forgejo/workflows/check-secrets.yml@main
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_MEDIUM }}
    secrets: inherit
    with:
      # Kingfisher's working-tree pass honours these path excludes; its
      # `--git-history full` pass scans blobs without a current filesystem
      # path, so history matches need `kingfisher_skip_regex` below. Includes
      # the `common` submodule (common's own CI already suppresses its
      # intentional POSTGRES.1 placeholder).
      kingfisher_excludes: "common docs tests scripts .env.saas.example .env.standalone.example test_config.sh"
      # Pattern-based suppressions for kingfisher. All of these are documented
      # placeholders and test fixtures: known-benign Postgres URIs built from
      # the `rusty_links` / `rustylinks` / `user` test accounts against the
      # local / in-cluster / loopback hosts, the specific dev-only password
      # strings the suite exercises for masking, hashing, verification and
      # the new-location gate, and the HTTP Bearer header reference in
      # src/ui/http.rs which is a module-doc comment. A real production
      # credential outside this set still fails the scan because it would
      # neither carry one of these usernames against a dev host nor match one
      # of the fixture password strings exactly.
      kingfisher_skip_regex: "postgres(?:ql)?://(?:rusty_links|rustylinks|user):(?:password|pass|rustylinks|changeme_secure_password_here|\\*{4})@|SecurePassword123!|SecurePass123!|StrongPassword123!|TestPassword123!|AnotherPassword123!|hunter2hunter2|my_secure_password_123|same_password|secure_password|password123|user_password|TEST_PASSWORD|changeme_secure_password_here|Authorization: Bearer header from localStorage"
      # Noseyparker finding ids for the same placeholders. A finding id is
      # derived from the rule + matched text, so it suppresses one known-benign
      # secret-shape wherever it appears and in history, and leaves the rule
      # live for every other match. A listed id this scan does not report
      # fails the job, so a suppression cannot outlive its finding.
      noseyparker_findings_exclude: "283448845a7df4dedac5c628b95bbf5f135d10a9,a2d90f8336fb80403b370b4c3d19534306c921e5,984900e09cba3c24729919ea873654d0f2a8ee20,12fd94cc81fa6ee60078c2601b04889cedc05b72,c48cdb78d2634f82388811333eb65677878f6404,9de4f394638049bba953486ca669c48d07c23103,f74340d7517e7db622bd0d692a6955d66cb60824,88095d0bb50bb58b62fa33efceae5c6f32ed7d15,2f811693e55516a7a6d07b07814d4f980cc9c55a,7f51f9e5353980886b39a256901644e8164824ce,69b4dbec98f9c20100f4d4b4341cec007278f99e,876d87057187d3664083e9e224431e08e5cf4a16,42983e83c204a6c662ff6f3859656412e2330409,74e56334d5d0b2cbd9ef9894d1e7b0b691906245,867002f357950c0afdc9abddca9f1cd9b76d4a8d,5626245e096554564889840f5662ae6cb1fc0112,bd289f453d91858b7ec29bb1271e13d13d7f9e40,8f28ff83937426e6ae8a72798571a9344e1c9730,b4f41ea35f7fcd55877280c00bcbeceb7508f1f9,e2396711c2cafcf18e3095e13bc8b3806c72a8da,1ec6bd496726bbe6958cc342b443337bda6a8540,3f4a3c40b9a1d98e48b1e8ced76bb86e306ae51c"

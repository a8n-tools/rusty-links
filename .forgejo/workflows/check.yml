---

# Validate code on every push and pull request: clippy, fmt, build, tests.
name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    name: clippy + fmt + tests
    # Dev label: this job compiles and links Rust on the runner (build scripts and
    # the host-target build/test need cc/ld plus glibc and OpenSSL headers, which
    # only the dev image carries).
    runs-on: ${{ vars.RUNS_ON_OPENSUSE_DEV_LATEST }}

    # Postgres for the tests/ targets (LINKS-44). Without it the only test legs
    # were `cargo test --lib`, so every query in src/models/ and src/auth/ was
    # compile-checked and never executed. 17-alpine matches compose.dev.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rustylinks
          POSTGRES_PASSWORD: rustylinks
          POSTGRES_DB: rustylinks
        # No published port: the runner puts the job container and this service
        # on one network, so the service alias is the address. A published port
        # lands in the docker daemon's namespace, which the job cannot reach.
        options: >-
          --health-cmd="pg_isready --username=rustylinks --dbname=rustylinks"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      # tests/common/mod.rs derives a sibling `rustylinks_test` database from
      # this and migrates that, so the suites never share a database with
      # anything else pointed at the same server.
      DATABASE_URL: postgres://rustylinks:rustylinks@postgres:5432/rustylinks

    steps:
      - name: Clone the repository
        uses: https://code.forgejo.org/actions/checkout@v5
        with:
          # Full history so the merge-base with origin/main is available to the
          # migration-immutability guard below.
          fetch-depth: 0

      - name: Guard migration immutability
        # Reject any PR/push that edits, renames, or deletes a migration already
        # committed on main (sqlx checksum drift breaks every applied DB). See
        # scripts/check-migration-immutability.nu and LINKS-26 / DEV-395.
        run: nu scripts/check-migration-immutability.nu

      - name: Guard justfile build flags
        # Reject a justfile `--features` name Cargo.toml does not define or a
        # `--build-arg` no Dockerfile declares. See scripts/check-build-flags.nu
        # and LINKS-25.
        run: nu scripts/check-build-flags.nu

      - name: Cache Rust build
        uses: https://github.com/Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Cap build parallelism
        # nproc/2 cap: never claim more than half the host (see CI.md "Concurrency cap").
        run: echo "CARGO_BUILD_JOBS=$(($(nproc) / 2))" >> "$GITHUB_ENV"

      - name: Ensure the generated stylesheet exists
        shell: nu {0}
        # assets/tailwind.css is gitignored and generated by `dx build`, but src/main.rs
        # include_str!s it, so the --features server legs need the file to exist.
        run: if not ("assets/tailwind.css" | path exists) { "" | save assets/tailwind.css }

      # Clippy, build and test each run twice, and the wasm check once, so all three
      # compilation configurations are covered. `default = []` gates every server module
      # behind `#[cfg(feature = "server")]`, so the default-feature legs on their own
      # compile almost none of the crate (LINKS-36).
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (server)
        run: cargo clippy --all-targets --features server -- -D warnings

      - name: Check web/WASM
        run: cargo check --features web --target wasm32-unknown-unknown

      - name: Build (default features)
        run: cargo build --all-targets

      - name: Build (server)
        run: cargo build --all-targets --features server

      - name: Unit tests (default features)
        run: cargo test --lib

      - name: Unit tests (server)
        run: cargo test --features server --lib

      - name: Apply migrations to the test database
        # Creates the sibling `rustylinks_test` database and applies every
        # migration through sqlx::migrate!, so a migration that does not apply
        # to an empty database fails here by name rather than inside an
        # unrelated test. No sqlx-cli install needed.
        run: cargo test --features server --test db_schema

      - name: Integration tests (Postgres-backed)
        shell: nu {0}
        # Runs every tests/*.rs target and fails when a database-backed one is
        # skipped, ignored, filtered out or absent: `cargo test` exits 0 on an
        # empty run, which is how LINKS-33 and LINKS-35 both shipped with no
        # executed SQL. --self-test first, so a guard that stopped detecting
        # fails the job rather than passing vacuously.
        run: |
          nu scripts/check-db-tests-ran.nu --self-test
          nu scripts/check-db-tests-ran.nu

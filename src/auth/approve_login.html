<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>{{TITLE}}</title>
    <style>
      :root {
        --bg: #1a1a2e;
        --text: #e0e0e0;
        --text-secondary: #a0a0b0;
        --accent: #4f8cff;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .approval-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 60px 20px;
      }
      .approval-container h1 {
        font-size: 2em;
        margin-bottom: 16px;
      }
      .approval-message {
        color: var(--text-secondary);
        font-size: 1.1em;
        max-width: 520px;
        line-height: 1.6;
      }
      .approval-details {
        margin: 24px 0;
        text-align: left;
        color: var(--text-secondary);
        line-height: 1.8;
      }
      .approval-details dt {
        font-weight: 600;
        color: var(--text);
      }
      .approval-details dd {
        margin: 0 0 8px 0;
        word-break: break-all;
      }
      .approval-button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 6px;
        font-size: 1em;
        padding: 12px 28px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="approval-container">
      <h1>{{HEADING}}</h1>
      <p class="approval-message">{{MESSAGE}}</p>
      {{DETAILS}}
      {{ACTION}}
    </div>
  </body>
</html>
